version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@2.0.1

jobs:
  setup:
    docker:
      - image: cimg/python:3.11  # Use >= 3.11 so TOML parser is available
    steps:
      - checkout
      - run:
          name: Install YAML parser
          command: python3 -m pip install pyyaml
      - run:
          name: Generate config
          command: python3 .circleci/generate_config.py > generated_config.yml
      - continuation/continue:
          configuration_path: generated_config.yml

workflows:
  setup:
    jobs:
      - setup
